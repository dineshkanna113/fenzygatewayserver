<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Fenzy mock gateway dashboard: captured SMS and email, payments and webhooks.">
  <title>Mock Gateway</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Crect x='0' width='2' height='12' fill='%23e8c531'/%3E%3Crect x='2' width='2' height='12' fill='%2335b7c4'/%3E%3Crect x='4' width='2' height='12' fill='%233fa66a'/%3E%3Crect x='6' width='2' height='12' fill='%23c2468f'/%3E%3Crect x='8' width='2' height='12' fill='%23d2453b'/%3E%3Crect x='10' width='2' height='12' fill='%232b4bd9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <span class="testbar mark" aria-hidden="true"></span>
        <div><b>Mock Gateway</b><small>Test mode. Nothing here is real.</small></div>
      </div>
      <nav id="nav" aria-label="Sections">
        <a data-tab="overview" href="#overview">Overview</a>
        <a data-tab="sms" href="#sms">SMS <span class="count num" id="c-sms"></span></a>
        <a data-tab="emails" href="#emails">Email <span class="count num" id="c-emails"></span></a>
        <a data-tab="payments" href="#payments">Payments <span class="count num" id="c-payments"></span></a>
        <a data-tab="webhooks" href="#webhooks">Webhooks <span class="count warn num" id="c-webhooks" title="Failed deliveries"></span></a>
        <a data-tab="settings" href="#settings">Settings</a>
      </nav>
      <div class="rail-foot">
        <div class="live" role="status"><span class="dot" id="live-dot"></span><span id="live-text">Connecting</span></div>
        <div class="user"><span class="avatar" aria-hidden="true">A</span><span id="who">admin</span><button class="btn ghost sm" id="logout">Sign out</button></div>
      </div>
    </aside>
    <main class="sheet">
      <span class="testbar" aria-hidden="true"></span>
      <header class="top">
        <h1 id="title">Overview</h1>
        <div class="top-actions">
          <label class="sr-only" for="search">Search</label>
          <input id="search" class="input" type="search" placeholder="Search this list" autocomplete="off">
          <button class="btn ghost" id="density" type="button" aria-pressed="false" title="Show more rows on screen">Compact rows</button>
          <button class="btn ghost" id="refresh" type="button">Refresh</button>
          <button class="btn ghost danger" id="clear" type="button" title="Delete all records in this tab">Clear</button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <span class="testbar" aria-hidden="true"></span>
      <div class="drawer-head"><h2 id="drawer-title"></h2><button class="btn ghost" id="drawer-close" type="button">Close</button></div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </div>
  <script src="/assets/dashboard.js"></script>
</body>
</html>
